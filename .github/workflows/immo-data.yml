# Statistiques immobilières françaises gratuites (DVF, loyers, INSEE…) -> data/immo
name: Immo data
on:
  workflow_dispatch:
    inputs:
      step: {description: "discover | peek | build", required: true, default: build}
      only: {description: "build : sources à refaire (communes,dvf,loyers,oll,fiscalite,insee) — vide = tout", required: false, default: ""}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow
      - run: python scripts/immo/${{ inputs.step }}.py
        env: {ONLY: "${{ inputs.only }}"}
      - run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add data/immo
          git commit -m "Données immo : ${{ inputs.step }}" || echo "Rien de nouveau"
          git pull --rebase -X theirs && git push
